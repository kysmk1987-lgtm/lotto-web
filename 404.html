<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- `flutter build web --base-href` 값으로 치환됩니다 (GitHub Pages: /lotto-web/, Vercel: /). -->
  <base href="/lotto-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="로또 6/45 역대 당첨 결과와 통계 기반 참고용 번호 분석. 당첨을 보장하지 않습니다.">
  <meta name="theme-color" content="#FFFFFF">
  <!-- 기기 다크 모드와 관계없이 항상 밝은 화면 -->
  <meta name="color-scheme" content="light only">

  <meta property="og:title" content="로또놀이터">
  <meta property="og:description" content="역대 당첨 결과 · 번호 통계 · 참고용 추천 (당첨 보장 없음)">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="로또놀이터">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>로또놀이터</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; color-scheme: light only; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      color: #1E3A66; transition: opacity .3s;
    }
    #splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 4px 16px rgba(0,0,0,.15); }
    #splash .bar { width: 120px; height: 4px; border-radius: 2px; background: #D0DBEE; overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #1E6FD9;
      animation: slide 1s infinite ease-in-out;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <div style="font-weight:600">로또놀이터</div>
    <div class="bar"></div>
    <noscript>이 앱을 사용하려면 JavaScript 를 켜 주세요.</noscript>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 300); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
